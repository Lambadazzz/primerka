<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe8de">
  <title>Примерка Юлки</title>
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script type="module" src="./assets/app.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-dcXq09Rf.css">
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./assets/editor.css"></head>
<body class="preload panel-hidden">
<div id="stage"><canvas id="view"></canvas></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2c.6 3.9 2.4 6.6 5.4 8.1-3 1.5-4.8 4.2-5.4 8.1-.6-3.9-2.4-6.6-5.4-8.1 3-1.5 4.8-4.2 5.4-8.1z"/><circle cx="19" cy="19" r="1.6"/><circle cx="5" cy="4.5" r="1.1"/></svg></span>
    <div class="brand-text"><b>Примерка Юлки</b><small>Эскиз на тело</small></div>
  </div>
  <nav class="tool-rail" aria-label="Инструменты примерки">
    <div class="tool-list">
    <button class="icon-btn" id="btnProjects" type="button" aria-label="Проекты" title="Проекты и экспорт"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button>
    <button class="icon-btn" id="btnPaint" type="button" aria-label="Рисовать" title="Рисовать"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l1-5L16 4a2.8 2.8 0 0 1 4 4L9 19Z"/></svg></button>
    <button class="icon-btn" id="btnResetView" type="button" aria-label="Вернуть вид" title="Вернуть вид"><i data-lucide="scan"></i></button>
    <button class="icon-btn" id="btnShot" type="button" aria-label="Снимок" title="Снимок"><i data-lucide="camera"></i></button>
    <button class="icon-btn insp-btn" id="btnInsp" type="button" title="Настройки эскиза" aria-label="Настройки эскиза" aria-controls="inspector" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h4m4 0h10M7 3v6m-4 3h11m4 0h3m-7-3v6M3 18h4m4 0h10M7 15v6"/></svg></button>
    <button class="icon-btn" id="btnClear" type="button" aria-label="Очистить модель" title="Очистить модель"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18m-2 0-1 14H6L5 6m4 0V3h6v3m-5 4v6m4-6v6"/></svg></button>
    </div>
    <button class="icon-btn" id="btnPanel" type="button" aria-label="Показать свойства модели" aria-controls="modelProperties" aria-expanded="false"><i data-lucide="panel-left"></i></button>
  </nav>
  <button class="icon-btn" id="btnSettings" type="button" aria-label="Настройки" title="Настройки" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--paint-paper)"/><circle cx="15" cy="17" r="2.5" fill="var(--paint-paper)"/></svg></button>
</header>

<div id="dismissViewerMenu" aria-hidden="true" hidden></div>
<aside class="panel models" id="modelProperties">
  <div class="seg small" id="segVariant"><button data-v="1">Модель 1</button><button data-v="2">Модель 2</button><button data-v="3">Руки по швам</button></div>
  <div class="seg" id="segSex"><button data-v="female">Женская</button><button data-v="male">Мужская</button></div>
  <div class="tiles" id="tilesPart">
    <button class="tile" data-v="body"><i data-lucide="person-standing"></i><span>Тело</span></button>
    <button class="tile" data-v="arm"><i data-lucide="biceps-flexed"></i><span>Рука</span></button>
    <button class="tile" data-v="leg"><i data-lucide="footprints"></i><span>Нога</span></button>
  </div>
  <div class="seg small" id="segSide"><button data-v="L">Левая</button><button data-v="R">Правая</button></div>
  <div class="label">Цвет модели</div>
  <div class="swatches" id="tones"></div>
  <div class="label">Фон</div>
  <div class="swatches" id="backgrounds"></div>
</aside>

<aside class="panel inspector" id="inspector">
  <div class="insp-head">
    <div class="thumb"><img id="inspThumb" alt=""></div>
    <div class="insp-title"><b id="inspTitle">Эскиз</b><small id="inspDims"></small></div>
    <button class="icon-btn flat" id="btnDeselect" title="Готово"><i data-lucide="x"></i></button>
  </div>
  <div class="field">
    <div class="field-head"><span>Ширина</span><output id="outSize"></output></div>
    <input type="range" id="rngSize" min="0" max="1000" step="1">
  </div>
  <div class="field">
    <div class="field-head"><span>Поворот</span><output id="outRot"></output></div>
    <input type="range" id="rngRot" min="-180" max="180" step="1">
  </div>
  <div class="field">
    <div class="field-head"><span>Насыщенность</span><output id="outOpacity"></output></div>
    <input type="range" id="rngOpacity" min="20" max="100" step="1">
  </div>
  <div class="actions-grid">
    <button id="actWrap"><i data-lucide="refresh-ccw"></i><span>Обернуть вокруг</span></button>
    <button id="actFlip"><i data-lucide="flip-horizontal-2"></i><span>Отразить</span></button>
    <button id="actEdit"><i data-lucide="wand-sparkles"></i><span>Фон и цвет</span></button>
    <button id="actDup"><i data-lucide="copy"></i><span>Копия</span></button>
  </div>
  <button class="danger-btn" id="actDelete"><i data-lucide="trash-2"></i><span>Удалить эскиз</span></button>
  <p class="tip">Тяните эскиз пальцем. Двумя пальцами на эскизе — размер и поворот.</p>
</aside>

<div class="dock">
  <div class="layers" id="layers"></div>
  <button class="fab" id="btnAdd" aria-label="Добавить эскиз"><i data-lucide="image-plus"></i><span>Добавить эскиз</span></button>
</div>

<div class="hint" id="hint"><span id="hintText"></span><button id="hintCancel" class="hint-x" hidden>Отмена</button></div>
<div class="loader" id="loader"><div class="spinner"></div><span>Загружаю модель…</span></div>
<input type="file" id="file" accept="image/*" hidden>

<div class="sheet-backdrop" id="sheet">
  <div class="sheet">
    <div class="sheet-preview bg-checker" id="sheetPreview">
      <canvas id="previewCanvas"></canvas>
      <div class="preview-bg" id="previewBg">
        <button data-bg="checker" title="Прозрачность"></button>
        <button data-bg="skin" title="На коже"></button>
        <button data-bg="dark" title="Тёмный"></button>
      </div>
    </div>
    <div class="sheet-side">
      <h2 id="sheetTitle">Подготовка эскиза</h2>
      <p class="sheet-sub">Белый или серый лист станет прозрачным, останутся только линии.</p>
      <label class="switch-row">
        <span><b>Убрать фон</b><small>для фото и сканов на бумаге</small></span>
        <input type="checkbox" id="optRemove"><i class="switch"></i>
      </label>
      <div class="field" id="fieldStrength">
        <div class="field-head"><span>Чистка фона</span><output id="outStrength"></output></div>
        <input type="range" id="optStrength" min="0" max="100" step="1">
        <div class="range-legend"><span>бережно</span><span>сильно</span></div>
      </div>
      <div class="field" id="fieldMode">
        <div class="field-head"><span>Линии</span></div>
        <div class="seg" id="segMode"><button data-v="ink">Чернила</button><button data-v="original">Как на фото</button></div>
      </div>
      <div class="field" id="fieldInk">
        <div class="field-head"><span>Цвет чернил</span></div>
        <div class="swatches" id="inks"></div>
      </div>
      <div class="sheet-actions">
        <button class="ghost-btn" id="btnSheetCancel">Отмена</button>
        <button class="primary-btn" id="btnSheetOk">Нанести на тело</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
